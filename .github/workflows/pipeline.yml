# Generated by `deploy.sh cicd --emit`. Safe to edit; re-emit to regenerate.
#
# deploykit printed this and wrote nothing — commit it yourself as
# .github/workflows/pipeline.yml. Note that a `gh` OAuth token has no
# `workflow` scope, so pushing anything under .github/workflows/ over HTTPS is
# rejected; an SSH remote is unaffected.
name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Roll back: an existing short SHA to promote instead of building. Empty builds this branch."
        required: false
        default: ""

jobs:
  # Your tests. deploykit does not generate or touch this job — replace the
  # stub with whatever your project actually runs. Nothing is promoted or
  # deployed unless it passes.
  #
  # To add more checks, add jobs beside this one and name them in the pipeline
  # job's `needs:` below. Nothing else needs editing — the gate is written
  # against needs.*.result, so it covers whatever you add.
  #
  # Skipped on a rollback: you roll back BECAUSE something is broken, and
  # gating that on the current head's tests would block the one action that
  # fixes production. A rollback promotes an artifact that already passed.
  test:
    if: github.event.inputs.sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install`, not `npm ci`: package-lock.json is gitignored, so there is
      # no lockfile to install from. The Dockerfile copies only package.json and
      # does the same, which keeps CI and the image build consistent.
      - name: Build the SPA
        run: |
          npm install --include=dev
          npm run build
        env:
          # Placeholders. vite.config.js feeds these through `define`, and an
          # unset one becomes a literal `undefined` in the bundle rather than a
          # build error - which would pass here and break in a browser. The real
          # values are baked in by the image build from BUILD_ARGS.
          APP_API_KEY: ci-build-check
          PAGE_SIZE: '250'
          VITE_API_BASE_URL: ''
          VITE_GOOGLE_CLIENT_ID: ci-build-check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Compile rather than install: requirements.txt pulls scikit-learn and
      # scipy, several minutes of wheels to prove only that the syntax parses.
      # The smoke job boots the real image, which is the honest import check.
      - name: Byte-compile the server
        run: python -m compileall -q server

  pipeline:
    needs: [test]
    # A SKIPPED job (rollback) must not block; a failed or cancelled one must.
    # Written against needs.*.result so adding a job to `needs:` is enough.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    # Required. A called workflow's permissions can never EXCEED the calling
    # job's, and GitHub's default token is read-only — without this the run
    # fails at startup with no logs at all. (An ordinary workflow behaves
    # differently: job-level permissions there just override the default.)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploykit-pipeline.yml
    with:
      services: '[{"name":"app","context":".","dockerfile":"./Dockerfile"}]'
      image_prefix: 'cinephile'
      owner: 'roland-02'
      tier: 'staging'
      health_path: '/'
      health_status: '200'
      promote_sha: ${{ github.event.inputs.sha || '' }}
    # Not `inherit`, and deliberately STAGING-only: the production uuid is
    # never passed in, so this pipeline cannot redeploy production even when
    # misconfigured. Production is promoted by `deploy.sh cicd --promote`.
    secrets:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_STAGING }}
      # Empty when the project sets no CICD_BUILD_ARGS, which the reusable
      # workflow treats as no --build-arg at all.
      BUILD_ARGS: ${{ secrets.BUILD_ARGS }}
