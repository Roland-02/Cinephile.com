# Build once, promote a pointer tag, redeploy.
#
# Generated from deploykit's pipeline and then flattened: deploykit sets a
# project's CI/CD up, it is not a dependency a run reaches into. Everything this
# project needs to build and deploy is in this one file.
#
# A push to main builds the image once and publishes it as an immutable manifest
# tagged with the commit, then moves the `staging` pointer tag onto that same
# manifest and tells Coolify to pull it. What deploys is byte-identical to what
# was tested, rather than a fresh dependency resolve of the same source.
#
# Rolling back is a tag move, not a rebuild - the sha- tag of every past build
# is permanent:
#
#   gh workflow run pipeline.yml --ref main -f sha=ad46111
#
# That skips the tests deliberately: you roll back BECAUSE something is broken,
# and gating it on the current head would block the one action that fixes
# production. The artifact being promoted already passed on the way in.
name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Roll back: an existing short SHA to promote instead of building. Empty builds this branch."
        required: false
        default: ""

env:
  # One service, one image. The `staging` tag is this project's only tier - see
  # CICD_PRODUCTION_BRANCH in deploy.env for why the single environment is
  # labelled that way.
  IMAGE: ghcr.io/roland-02/cinephile-app
  TIER: staging

jobs:
  # Skipped on a rollback, per the note at the top of this file.
  test:
    if: github.event.inputs.sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install`, not `npm ci`: package-lock.json is gitignored, so there is
      # no lockfile to install from. The Dockerfile copies only package.json and
      # does the same, which keeps CI and the image build consistent.
      - name: Build the SPA
        run: |
          npm install --include=dev
          npm run build
        env:
          # Placeholders. vite.config.js feeds these through `define`, and an
          # unset one becomes a literal `undefined` in the bundle rather than a
          # build error - which would pass here and break in a browser. The real
          # values are baked in by the image build from BUILD_ARGS.
          APP_API_KEY: ci-build-check
          PAGE_SIZE: '250'
          VITE_API_BASE_URL: ''
          VITE_GOOGLE_CLIENT_ID: ci-build-check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Compile rather than install: requirements.txt pulls scikit-learn and
      # scipy, several minutes of wheels to prove only that the syntax parses.
      - name: Byte-compile the server
        run: python -m compileall -q server

  # The short SHA is computed ONCE and consumed everywhere else, so promotion
  # cannot straddle two builds. No checkout: GITHUB_SHA is already the commit.
  prepare:
    needs: [test]
    # A SKIPPED test job (rollback) must not block; a failed or cancelled one
    # must. Written against needs.*.result so adding another gate job to
    # `needs:` is all it takes to have it covered too.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - id: vars
        env:
          PROMOTE_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PROMOTE_SHA" ]; then
            sha="$PROMOTE_SHA"
            echo "rollback: promoting existing sha-$sha, nothing will be built"
          else
            sha="${GITHUB_SHA::7}"
            echo "building sha-$sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event.inputs.sha == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ needs.prepare.outputs.sha }}
          # The frontend bakes these into the bundle at build time. Coolify used
          # to supply them implicitly - its build pack passes every environment
          # variable as a --build-arg - so once Actions owns the build they have
          # to be declared or they compile in as `undefined`.
          build-args: ${{ secrets.BUILD_ARGS }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # Moves the pointer tag onto the manifest that was just built. Nothing is
  # rebuilt: imagetools repoints the tag at a manifest that already exists, so
  # the promoted artifact is byte-identical to the one that was tested.
  promote:
    needs: [prepare, build]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (github.event.inputs.sha != '' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :${{ env.TIER }} onto sha-${{ needs.prepare.outputs.sha }}
        env:
          SRC: ${{ env.IMAGE }}:sha-${{ needs.prepare.outputs.sha }}
          DST: ${{ env.IMAGE }}:${{ env.TIER }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$DST" "$SRC"
          echo "tagged $DST -> $SRC"

  trigger:
    needs: promote
    # GitHub propagates `skipped` transitively through the dependency graph. On
    # a rollback the build job is skipped, so without an explicit result check
    # this job would inherit that skip through promote - the pointer tag would
    # move and Coolify would never be told to pull it, leaving the bad image
    # serving.
    if: always() && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Tell Coolify to redeploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ secrets.COOLIFY_APP_UUID_STAGING }}
        run: |
          # Deliberately NOT `set -e`: when curl itself fails (DNS, refused,
          # TLS) the assignment is what fails, and -e would abort before the
          # diagnosis is printed - leaving a bare exit code in the log.
          set -uo pipefail
          url="${COOLIFY_URL%/}/api/v1/deploy?uuid=$UUID&force=true"
          code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -X GET \
            "$url" -H "Authorization: Bearer $COOLIFY_TOKEN") ; rc=$?
          if [ $rc -ne 0 ]; then
            # Path only, never the query string. The uuid is not secret, but
            # GitHub masks only values it knows are secrets, so keep the habit.
            echo "curl failed (exit $rc) calling: ${url%%\?*}"
            case $rc in
              6)  echo "  exit 6 = could not resolve host. Check the COOLIFY_URL secret" \
                       "is a bare URL - a value copied out of deploy.env by text keeps" \
                       "its quotes, and 'http://host becomes the hostname." ;;
              7)  echo "  exit 7 = connection refused; is Coolify up and reachable?" ;;
              28) echo "  exit 28 = timed out after 30s." ;;
            esac
            exit 1
          fi
          echo "HTTP $code"; cat /tmp/out; echo
          [ "$code" = "200" ] || exit 1
